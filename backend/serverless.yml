service: portfolio-contact-api

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  environment:
    EMAIL_USER: ${env:EMAIL_USER}
    EMAIL_PASS: ${env:EMAIL_PASS}
    CONTACT_EMAIL: ${env:CONTACT_EMAIL}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"

functions:
  sendContactEmail:
    handler: src/handlers/emailHandler.sendContactEmail
    timeout: 30
    events:
      - http:
          path: /api/contact
          method: post
          cors: true

      - http:
          path: /api/contact
          method: options
          cors: true

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3001
    noPrependStageInUrl: true

useDotenv:
  path: ./backend/.env
